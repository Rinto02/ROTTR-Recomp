# ============================================================
# DXVK Configuration — Rise of the Tomb Raider (Android/ARM64)
# ============================================================
# Optimized for mobile Vulkan (Adreno via Turnip driver)
# Place this file next to the game executable or in the
# Wine prefix root.

# --- Performance ---

# Limit frame rate to prevent thermal throttling
dxvk.maxFrameRate = 30

# Use async shader compilation to reduce stuttering
dxvk.enableAsync = True

# Number of compiler threads (keep low on mobile)
dxvk.numCompilerThreads = 2
dxvk.numAsyncThreads = 1

# --- Memory Management ---

# Limit VRAM budget to prevent OOM on mobile (in MB)
# Most Android devices share system RAM with GPU
dxvk.maxChunkSize = 64

# --- Shader / State Cache ---

# Enable state cache for faster subsequent launches
dxvk.enableStateCache = True

# Shader cache path (relative to game directory)
dxvk.stateCachePath = ""

# --- Graphics Workarounds ---

# Force MAILBOX present mode for better frame pacing
dxvk.presentMode = mailbox

# Disable GPU query events (reduces overhead on mobile Vulkan)
dxvk.useRawSsbo = True

# --- HUD (disable in release, enable for debugging) ---
# dxvk.hud = fps,devinfo,gpuload
dxvk.hud = none

# --- Logging ---
# Set to "none" for release, "info" for debugging
dxvk.logLevel = none
